<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="0.52" stop-color="#f5eadb"/>
      <stop offset="1" stop-color="#ead9c7"/>
    </linearGradient>
    <linearGradient id="leftFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7ecdf"/>
      <stop offset="1" stop-color="#e6d3bf"/>
    </linearGradient>
    <linearGradient id="rightFold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="1" stop-color="#ead8c6"/>
    </linearGradient>
    <linearGradient id="bottomFold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f1e3d3"/>
      <stop offset="1" stop-color="#fff9f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#6d5747" flood-opacity=".22"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="softNoise">
        <feFuncA type="table" tableValues="0 .07"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <clipPath id="clip">
      <rect x="50" y="60" width="900" height="520" rx="18"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="50" y="60" width="900" height="520" rx="18" fill="url(#paper)"/>
    <g clip-path="url(#clip)" filter="url(#grain)">
      <polygon points="50,60 500,350 50,580" fill="url(#leftFold)"/>
      <polygon points="950,60 500,350 950,580" fill="url(#rightFold)"/>
      <polygon points="50,580 500,300 950,580" fill="url(#bottomFold)"/>
      <path d="M50 60 L500 350 L950 60" fill="none" stroke="#d9c5b2" stroke-width="2" opacity=".55"/>
      <path d="M50 580 L500 300 L950 580" fill="none" stroke="#dfcdbb" stroke-width="2" opacity=".48"/>
      <path d="M50 60 L500 350" stroke="#fffdf9" stroke-width="2" opacity=".42"/>
      <path d="M950 60 L500 350" stroke="#fffdf9" stroke-width="2" opacity=".42"/>
    </g>
    <rect x="50" y="60" width="900" height="520" rx="18" fill="none" stroke="#d9c4af" stroke-width="2" opacity=".55"/>
  </g>
</svg>