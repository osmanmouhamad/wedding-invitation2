<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="flapPaper" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="0.55" stop-color="#f2e4d4"/>
      <stop offset="1" stop-color="#e4d0bb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#6b5648" flood-opacity=".20"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .065"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M50 30 H950 L500 390 Z" fill="url(#flapPaper)" filter="url(#grain)"/>
    <path d="M50 30 H950 L500 390 Z" fill="none" stroke="#d4bea8" stroke-width="2" opacity=".65"/>
    <path d="M75 46 H925" stroke="#fffdf9" stroke-width="3" opacity=".45"/>
  </g>
</svg>